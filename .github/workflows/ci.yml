name: Checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check mrcat skills tests
      - run: python -m pytest -m "not r" -q
      - run: node tests/test_result_formatters.cjs
      - run: python -m build
      - name: Check the installed wheel outside the checkout
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/mrcat-wheel"
          "$RUNNER_TEMP/mrcat-wheel/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mrcat-wheel/bin/python" "$GITHUB_WORKSPACE/tests/check_installed.py"
