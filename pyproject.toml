[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrcat"
version = "0.1.0"
description = "A skill-guided agent for Mendelian randomization analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY.md"]
keywords = ["Mendelian randomization", "GWAS", "agent", "bioinformatics"]
dependencies = [
  "PyYAML>=6", "python-dotenv>=1", "requests>=2.31",
  "anthropic>=0.42", "openai>=1.6",
  "fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.30",
  "PyJWT[crypto]>=2.10,<3", "Markdown>=3.6", "bleach>=6.1", "matplotlib>=3.7",
  "openpyxl>=3.1", "pandas>=2", "scipy>=1.11",
  "langchain-core==1.2.15", "langgraph==0.6.11",
  "langgraph-checkpoint-sqlite==2.0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1", "ruff>=0.8"]

[project.scripts]
mrcat = "mrcat.cli:main"
mrcat-web = "mrcat.web.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrcat*", "skills*"]
exclude = ["*.tests", "*.tests.*", "*.execution", "*.execution.*"]
namespaces = true

[tool.setuptools.package-data]
"mrcat" = ["prompts/*.md", "tool/**/*.R", "web/static/**/*"]
"skills" = ["**/*.md", "**/*.R", "**/*.json", "**/*.yaml", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "r: runs real R analysis and needs the documented R packages",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.exclude-package-data]
"*" = ["**/execution/**", "**/tests/**", "**/BWMR_updated.R", "**/build_contract.json", "**/build_validation.json", "**/Rplots.pdf"]
